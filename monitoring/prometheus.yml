global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project:     aws-devops-lab
    owner:       diegonunfio

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: aws-devops-lab-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: [api:3000]
        labels:
          service:     aws-devops-lab-api
          environment: local

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          instance: local-host

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
        labels:
          instance: docker-host
