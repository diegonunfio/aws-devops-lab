name: CD — Simulated Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI — Build, Test & Push"]
    branches: [main]
    types: [completed]

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:

  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest

    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulate deployment
        run: |
          echo "Deploying latest version to STAGING..."
          sleep 5
          echo "Containers updated"
          echo "Load balancer healthy"

      - name: Smoke test
        run: |
          echo "Testing /health endpoint..."
          sleep 3
          echo "HTTP 200 OK"

      - name: Success
        run: echo "Staging deployment completed successfully"

  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: deploy-staging

    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulate production deploy
        run: |
          echo "Deploying to PRODUCTION..."
          sleep 5
          echo "Rolling update completed"

      - name: Smoke test
        run: |
          echo "Production /health check OK"

      - name: Create release note
        run: echo "Production deployment successful"