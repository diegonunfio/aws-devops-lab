name: Terraform (Manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

defaults:
  run:
    working-directory: infra/terraform

env:
  TF_VERSION: "1.7.0"
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init (disabled backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event.inputs.action == 'plan'
        run: |
          terraform plan \
            -var="environment=staging" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -no-color

      - name: Terraform apply skipped
        if: github.event.inputs.action == 'apply'
        run: echo "AWS credentials not configured. Apply disabled."

      - name: Terraform destroy skipped
        if: github.event.inputs.action == 'destroy'
        run: echo "AWS credentials not configured. Destroy disabled."