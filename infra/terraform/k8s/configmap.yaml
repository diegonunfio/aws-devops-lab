apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-devops-lab-config
  namespace: aws-devops-lab
  labels:
    app: aws-devops-lab-api
data:
  NODE_ENV:    "production"
  LOG_LEVEL:   "info"
  APP_VERSION: "1.0.0"

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aws-devops-lab-api
  namespace: aws-devops-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aws-devops-lab-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aws-devops-lab-api
  namespace: aws-devops-lab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aws-devops-lab-api

---
apiVersion: v1
kind: Namespace
metadata:
  name: aws-devops-lab
  labels:
    name: aws-devops-lab
